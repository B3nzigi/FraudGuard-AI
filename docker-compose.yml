services:
  db:
    image: postgres:15-alpine
    container_name: fraudguard_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fraud_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
      ml_service:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: fraud_db
      ML_SERVICE_URL: http://ml_service:8001
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the project .env file}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080

  ml_service:
    build: ./ml_service
    ports: ["8001:8001"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8001/health\", timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    environment:
      DB_HOST: db
      DB_NAME: fraud_db
    command: uvicorn app:app --host 0.0.0.0 --port 8001

  frontend:
    build: ./frontend/frontend
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  postgres_data:

